<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>카피바라 환경동아리 메타버스 · 시작맵</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --olive-dark:#5C6353;
    --olive:#6E7365;
    --olive-deep:#3F453A;
    --gold:#F3C64B;
    --gold-deep:#D9942B;
    --halo:#CBEF7E;
    --paper:#F7F5EA;
    --ink:#2B3126;
  }

  *{ box-sizing:border-box; }

  html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--olive-dark);
    color:var(--paper);
    font-family:"NanumSquareRound","NanumSquare","Noto Sans KR","Malgun Gothic",sans-serif;
    user-select:none;
  }

  #app{
    position:fixed;
    inset:0;
  }

  canvas{
    display:block;
    outline:none;
  }

  /* ---------- loading screen ---------- */
  #loading{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    background:
      radial-gradient(120% 90% at 50% -10%, #7C8470 0%, #5C6353 55%, #3F453A 100%);
    transition:opacity .6s ease;
  }
  #loading.hide{
    opacity:0;
    pointer-events:none;
  }
  .loading-badge{
    width:64px;
    height:64px;
    border-radius:50%;
    border:4px solid rgba(247,245,234,.18);
    border-top-color:var(--gold);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-text{
    font-size:18px;
    font-weight:700;
    letter-spacing:.02em;
    color:var(--paper);
    text-shadow:0 2px 8px rgba(0,0,0,.25);
  }
  .loading-sub{
    font-size:13px;
    color:rgba(247,245,234,.65);
  }

  /* ---------- HUD ---------- */
  .hud{
    position:fixed;
    z-index:20;
    pointer-events:none;
  }

  .hud-card{
    background:rgba(92,99,83,.62);
    backdrop-filter:blur(6px);
    border:1px solid rgba(243,198,75,.35);
    border-radius:20px;
    padding:14px 20px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
  }

  #title-card{
    top:20px;
    left:20px;
    max-width:320px;
  }
  #title-card h1{
    margin:0 0 4px;
    font-size:17px;
    font-weight:900;
    color:var(--paper);
  }
  #title-card p{
    margin:0;
    font-size:12.5px;
    line-height:1.5;
    color:rgba(247,245,234,.82);
  }
  #title-card .badge{
    display:inline-block;
    margin-bottom:8px;
    padding:3px 10px;
    border-radius:999px;
    background:rgba(243,198,75,.18);
    color:var(--gold);
    font-size:11px;
    font-weight:700;
    letter-spacing:.04em;
  }

  #controls-card{
    bottom:20px;
    left:20px;
  }
  #controls-card .keys{
    display:flex;
    gap:6px;
    align-items:center;
    font-size:12px;
    color:var(--paper);
  }
  .key{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:26px;
    height:26px;
    padding:0 6px;
    border-radius:8px;
    background:rgba(247,245,234,.14);
    border:1px solid rgba(247,245,234,.3);
    font-weight:700;
    font-size:11px;
  }

  #portal-hint{
    top:20px;
    right:20px;
    text-align:right;
    opacity:0;
    transform:translateY(-6px);
    transition:opacity .35s ease, transform .35s ease;
  }
  #portal-hint.show{
    opacity:1;
    transform:translateY(0);
  }
  #portal-hint h2{
    margin:0 0 2px;
    font-size:15px;
    font-weight:900;
    color:var(--gold);
  }
  #portal-hint p{
    margin:0;
    font-size:11.5px;
    color:rgba(247,245,234,.75);
  }
</style>
</head>
<body>

  <div id="app"></div>

  <div id="loading">
    <div class="loading-badge"></div>
    <div class="loading-text">불러오는 중...</div>
    <div class="loading-sub">카피바라 환경동아리 메타버스 시작맵을 준비하고 있어요</div>
  </div>

  <div class="hud hud-card" id="title-card">
    <span class="badge">CAPYBARA · 환경동아리</span>
    <h1>시작맵</h1>
    <p>낮은 언덕과 오솔길을 따라 걸으며 네 곳의 포탈을 찾아보세요.<br/>포탈에 가까이 다가가면 안내판이 밝아집니다.</p>
  </div>

  <div class="hud hud-card" id="controls-card">
    <div class="keys">
      <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>
      <span style="opacity:.5;margin:0 4px;">또는</span>
      <span class="key">↑</span><span class="key">←</span><span class="key">↓</span><span class="key">→</span>
      <span style="margin-left:8px;color:rgba(247,245,234,.75);">이동</span>
    </div>
  </div>

  <div class="hud hud-card" id="portal-hint">
    <h2 id="portal-hint-name">포탈</h2>
    <p>가까이 다가왔습니다</p>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

/* =========================================================
   기본 세팅
========================================================= */
const COLORS = {
  oliveDark: 0x5C6353,
  olive: 0x6E7365,
  oliveDeep: 0x3F453A,
  gold: 0xF3C64B,
  goldDeep: 0xD9942B,
  halo: 0xCBEF7E,
  paper: 0xF7F5EA,
};

const app = document.getElementById("app");

const scene = new THREE.Scene();
scene.background = new THREE.Color(COLORS.oliveDark);
scene.fog = new THREE.Fog(COLORS.oliveDark, 34, 95);

const camera = new THREE.PerspectiveCamera(
  52,
  window.innerWidth / window.innerHeight,
  0.1,
  300
);
camera.position.set(0, 8, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* =========================================================
   조명 (올리브/골드 팔레트 반영)
========================================================= */
const hemi = new THREE.HemisphereLight(0xB9C58C, 0x3A3F32, 0.85);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xFFE9A6, 1.4);
sun.position.set(-22, 30, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60;
sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60;
sun.shadow.camera.bottom = -60;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 120;
sun.shadow.bias = -0.0015;
scene.add(sun);

const fill = new THREE.DirectionalLight(COLORS.halo, 0.28);
fill.position.set(20, 10, -20);
scene.add(fill);

/* =========================================================
   유틸: 시드 랜덤 (씬을 매번 동일하게 배치)
========================================================= */
function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20240521);

/* =========================================================
   바닥 (낮은 언덕 + 오솔길, 버텍스 컬러)
========================================================= */
const GROUND_SIZE = 140;
const GROUND_SEG = 90;

const groundGeo = new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE, GROUND_SEG, GROUND_SEG);
groundGeo.rotateX(-Math.PI / 2);

const grassA = new THREE.Color(0x76874E);
const grassB = new THREE.Color(0x8FA25A);
const grassDark = new THREE.Color(0x5B6B3E);
const pathColor = new THREE.Color(0xD9CBA0);
const pathEdge = new THREE.Color(0xC6B583);

// 포탈 위치 (동서남북 십자 배치)
const PORTAL_DIST = 42;
const PORTALS_DEF = [
  { name: "이론관", position: new THREE.Vector3(0, 0, -PORTAL_DIST), color: COLORS.gold },
  { name: "대전지도관", position: new THREE.Vector3(PORTAL_DIST, 0, 0), color: COLORS.halo },
  { name: "실험실관", position: new THREE.Vector3(0, 0, PORTAL_DIST), color: COLORS.gold },
  { name: "캠페인관", position: new THREE.Vector3(-PORTAL_DIST, 0, 0), color: COLORS.halo },
];

function distToPathAxes(x, z) {
  // 중앙에서 4방향으로 뻗은 오솔길까지의 최단 거리
  const dAxisX = Math.abs(z); // 동서 축 길 (z ~ 0)
  const dAxisZ = Math.abs(x); // 남북 축 길 (x ~ 0)
  return Math.min(dAxisX, dAxisZ);
}

const posAttr = groundGeo.attributes.position;
const colors = new Float32Array(posAttr.count * 3);
const tmpColor = new THREE.Color();

for (let i = 0; i < posAttr.count; i++) {
  const x = posAttr.getX(i);
  const z = posAttr.getZ(i);

  // 완만한 언덕 (부드러운 사인 조합)
  let h =
    Math.sin(x * 0.07 + 1.3) * Math.cos(z * 0.09) * 1.1 +
    Math.sin(x * 0.15 - z * 0.05) * 0.5;

  const pathDist = distToPathAxes(x, z);
  const onPath = pathDist < 3.4;
  const nearCenter = Math.hypot(x, z) < 6.5;

  if (onPath || nearCenter) {
    h *= 0.12; // 길은 평평하게
  }
  posAttr.setY(i, h);

  // 색상
  if (onPath || nearCenter) {
    const edgeMix = Math.min(1, Math.max(0, (pathDist - 2.6) / 0.8));
    tmpColor.copy(pathColor).lerp(pathEdge, edgeMix);
  } else {
    const n = (Math.sin(x * 0.31) * Math.cos(z * 0.27) + 1) / 2;
    tmpColor.copy(grassA).lerp(grassB, n);
    if (rand() < 0.05) tmpColor.lerp(grassDark, 0.5);
  }
  colors[i * 3] = tmpColor.r;
  colors[i * 3 + 1] = tmpColor.g;
  colors[i * 3 + 2] = tmpColor.b;
}
groundGeo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
groundGeo.computeVertexNormals();

const groundMat = new THREE.MeshStandardMaterial({
  vertexColors: true,
  flatShading: true,
  roughness: 1,
  metalness: 0,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.receiveShadow = true;
scene.add(ground);

// 지면 높이 조회 (플레이어가 언덕을 따라 걷도록)
function groundHeightAt(x, z) {
  let h =
    Math.sin(x * 0.07 + 1.3) * Math.cos(z * 0.09) * 1.1 +
    Math.sin(x * 0.15 - z * 0.05) * 0.5;
  const pathDist = distToPathAxes(x, z);
  const nearCenter = Math.hypot(x, z) < 6.5;
  if (pathDist < 3.4 || nearCenter) h *= 0.12;
  return h;
}

/* =========================================================
   낮은 폴리곤 나무 / 수풀 / 바위
========================================================= */
const treeGroup = new THREE.Group();
scene.add(treeGroup);

function makeTree(scale, hueShift) {
  const g = new THREE.Group();

  const trunkH = 1.6 * scale;
  const trunkGeo = new THREE.CylinderGeometry(0.14 * scale, 0.2 * scale, trunkH, 6);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6B5439, flatShading: true, roughness: 1 });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = trunkH / 2;
  trunk.castShadow = true;
  g.add(trunk);

  const leafColors = [0x6E8C4A, 0x7FA855, 0x5C7A3E, 0x8FA25A];
  const leafColor = leafColors[hueShift % leafColors.length];
  const leafMat = new THREE.MeshStandardMaterial({ color: leafColor, flatShading: true, roughness: 0.95 });

  const tiers = 3;
  for (let t = 0; t < tiers; t++) {
    const r = (1.3 - t * 0.32) * scale;
    const h = (1.7 - t * 0.25) * scale;
    const coneGeo = new THREE.ConeGeometry(r, h, 7);
    const cone = new THREE.Mesh(coneGeo, leafMat);
    cone.position.y = trunkH + t * 0.9 * scale + h * 0.42;
    cone.castShadow = true;
    cone.rotation.y = rand() * Math.PI;
    g.add(cone);
  }
  return g;
}

function makeBush(scale) {
  const geo = new THREE.IcosahedronGeometry(0.55 * scale, 0);
  const mat = new THREE.MeshStandardMaterial({ color: 0x6E8C4A, flatShading: true, roughness: 1 });
  const m = new THREE.Mesh(geo, mat);
  m.position.y = 0.4 * scale;
  m.castShadow = true;
  m.scale.y = 0.8;
  return m;
}

function makeRock(scale) {
  const geo = new THREE.DodecahedronGeometry(0.4 * scale, 0);
  const mat = new THREE.MeshStandardMaterial({ color: 0x8B8C7C, flatShading: true, roughness: 1 });
  const m = new THREE.Mesh(geo, mat);
  m.position.y = 0.2 * scale;
  m.rotation.set(rand() * Math.PI, rand() * Math.PI, rand() * Math.PI);
  m.castShadow = true;
  return m;
}

function isBlocked(x, z, clearance) {
  if (distToPathAxes(x, z) < clearance) return true;
  if (Math.hypot(x, z) < 9) return true;
  for (const p of PORTALS_DEF) {
    if (p.position.distanceTo(new THREE.Vector3(x, 0, z)) < 11) return true;
  }
  return Math.hypot(x, z) > GROUND_SIZE / 2 - 6;
}

for (let i = 0; i < 220; i++) {
  const x = (rand() - 0.5) * GROUND_SIZE * 0.92;
  const z = (rand() - 0.5) * GROUND_SIZE * 0.92;
  if (isBlocked(x, z, 4.2)) continue;

  const roll = rand();
  let obj;
  if (roll < 0.62) {
    obj = makeTree(0.8 + rand() * 0.9, Math.floor(rand() * 4));
  } else if (roll < 0.85) {
    obj = makeBush(0.7 + rand() * 0.8);
  } else {
    obj = makeRock(0.7 + rand() * 1.1);
  }
  obj.position.set(x, groundHeightAt(x, z), z);
  obj.rotation.y = rand() * Math.PI * 2;
  treeGroup.add(obj);
}

/* =========================================================
   캐릭터 (캡슐 몸통 + 구 머리, 팔다리 애니메이션)
========================================================= */
const player = new THREE.Group();

const bodyMat = new THREE.MeshStandardMaterial({ color: COLORS.olive, flatShading: true, roughness: 0.9 });
const trimMat = new THREE.MeshStandardMaterial({ color: COLORS.gold, flatShading: true, roughness: 0.6, emissive: COLORS.goldDeep, emissiveIntensity: 0.15 });
const skinMat = new THREE.MeshStandardMaterial({ color: 0xE8C79E, flatShading: true, roughness: 0.9 });

const bodyPivot = new THREE.Group();
bodyPivot.position.y = 1.0;
player.add(bodyPivot);

const torsoGeo = new THREE.CapsuleGeometry(0.42, 0.6, 4, 8);
const torso = new THREE.Mesh(torsoGeo, bodyMat);
torso.castShadow = true;
bodyPivot.add(torso);

const vestGeo = new THREE.CylinderGeometry(0.44, 0.44, 0.32, 8, 1, true);
const vest = new THREE.Mesh(vestGeo, trimMat);
vest.position.y = 0.12;
bodyPivot.add(vest);

const headGeo = new THREE.SphereGeometry(0.34, 10, 8);
const head = new THREE.Mesh(headGeo, skinMat);
head.position.y = 0.75;
head.castShadow = true;
bodyPivot.add(head);

const leafGeo = new THREE.ConeGeometry(0.16, 0.3, 5);
const leaf = new THREE.Mesh(leafGeo, new THREE.MeshStandardMaterial({ color: COLORS.halo, flatShading: true, emissive: COLORS.halo, emissiveIntensity: 0.25 }));
leaf.position.set(0, 1.02, 0.02);
leaf.rotation.x = -0.3;
bodyPivot.add(leaf);

function makeLimb(isArm) {
  const pivot = new THREE.Group();
  const len = isArm ? 0.55 : 0.6;
  const geo = new THREE.CapsuleGeometry(isArm ? 0.1 : 0.13, len * 0.6, 3, 6);
  const mat = isArm ? bodyMat : new THREE.MeshStandardMaterial({ color: COLORS.oliveDeep, flatShading: true, roughness: 0.9 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = -len / 2;
  mesh.castShadow = true;
  pivot.add(mesh);
  return pivot;
}

const armL = makeLimb(true);
armL.position.set(-0.5, 0.35, 0);
bodyPivot.add(armL);
const armR = makeLimb(true);
armR.position.set(0.5, 0.35, 0);
bodyPivot.add(armR);

const legL = makeLimb(false);
legL.position.set(-0.2, -0.35, 0);
bodyPivot.add(legL);
const legR = makeLimb(false);
legR.position.set(0.2, -0.35, 0);
bodyPivot.add(legR);

player.position.set(0, 0, 6);
scene.add(player);

/* =========================================================
   포탈 (빛나는 링 + 기둥 + 라벨)
========================================================= */
function makeLabelSprite(text) {
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  const fontSize = 54;
  ctx.font = `900 ${fontSize}px "Noto Sans KR", sans-serif`;
  const padX = 46, padY = 26;
  const textW = ctx.measureText(text).width;
  canvas.width = Math.ceil(textW + padX * 2);
  canvas.height = fontSize + padY * 2;

  ctx.font = `900 ${fontSize}px "Noto Sans KR", sans-serif`;
  const r = 30;
  const w = canvas.width, h = canvas.height;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.arcTo(w, 0, w, h, r);
  ctx.arcTo(w, h, 0, h, r);
  ctx.arcTo(0, h, 0, 0, r);
  ctx.arcTo(0, 0, w, 0, r);
  ctx.closePath();
  ctx.fillStyle = "rgba(63,69,58,0.88)";
  ctx.fill();
  ctx.lineWidth = 6;
  ctx.strokeStyle = "#F3C64B";
  ctx.stroke();

  ctx.fillStyle = "#F7F5EA";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, w / 2, h / 2 + 4);

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  const aspect = canvas.width / canvas.height;
  sprite.scale.set(aspect * 1.9, 1.9, 1);
  sprite.renderOrder = 10;
  return sprite;
}

function createPortal(def) {
  const group = new THREE.Group();
  const facing = Math.atan2(-def.position.x, -def.position.z); // 중앙(스폰)을 바라보도록

  const ringMat = new THREE.MeshStandardMaterial({
    color: def.color,
    emissive: def.color,
    emissiveIntensity: 0.9,
    roughness: 0.35,
    metalness: 0.25,
    flatShading: true,
  });
  const ringGeo = new THREE.TorusGeometry(2.1, 0.26, 10, 28);
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.y = 2.5;
  ring.rotation.y = facing;
  ring.castShadow = true;
  group.add(ring);

  const discGeo = new THREE.CircleGeometry(1.8, 24);
  const discMat = new THREE.MeshBasicMaterial({
    color: COLORS.halo,
    transparent: true,
    opacity: 0.28,
    side: THREE.DoubleSide,
    depthWrite: false,
  });
  const disc = new THREE.Mesh(discGeo, discMat);
  disc.position.copy(ring.position);
  disc.rotation.copy(ring.rotation);
  group.add(disc);

  const baseGeo = new THREE.CylinderGeometry(1.5, 1.8, 0.55, 8);
  const baseMat = new THREE.MeshStandardMaterial({ color: 0x4A5145, flatShading: true, roughness: 1 });
  const base = new THREE.Mesh(baseGeo, baseMat);
  base.position.y = 0.28;
  base.receiveShadow = true;
  base.castShadow = true;
  group.add(base);

  const light = new THREE.PointLight(def.color, 1.1, 13, 2);
  light.position.set(0, 2.5, 0);
  group.add(light);

  const sprite = makeLabelSprite(def.name);
  sprite.position.set(0, 5.2, 0);
  group.add(sprite);

  group.position.copy(def.position);
  group.position.y = groundHeightAt(def.position.x, def.position.z);

  group.userData = {
    name: def.name,
    ring, disc, light, sprite,
    baseEmissive: 0.9,
    baseLightIntensity: 1.1,
    baseSpriteScale: sprite.scale.clone(),
    active: 0,
  };
  return group;
}

const portals = PORTALS_DEF.map(createPortal);
portals.forEach((p) => scene.add(p));

/* =========================================================
   입력 처리
========================================================= */
const keys = new Set();
window.addEventListener("keydown", (e) => keys.add(e.code));
window.addEventListener("keyup", (e) => keys.delete(e.code));

function moveVectorFromKeys() {
  let x = 0, z = 0;
  if (keys.has("KeyW") || keys.has("ArrowUp")) z -= 1;
  if (keys.has("KeyS") || keys.has("ArrowDown")) z += 1;
  if (keys.has("KeyA") || keys.has("ArrowLeft")) x -= 1;
  if (keys.has("KeyD") || keys.has("ArrowRight")) x += 1;
  const v = new THREE.Vector2(x, z);
  if (v.lengthSq() > 0) v.normalize();
  return v;
}

/* =========================================================
   메인 루프
========================================================= */
const MOVE_SPEED = 7.5;
const PORTAL_RADIUS = 9.5;
const portalHintEl = document.getElementById("portal-hint");
const portalHintNameEl = document.getElementById("portal-hint-name");

const camOffsetBase = new THREE.Vector3(0, 5.6, 9.2);
const camLookOffset = new THREE.Vector3(0, 1.6, 0);
let camPos = camera.position.clone();

const clock = new THREE.Clock();
let walkPhase = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // --- 이동 ---
  const mv = moveVectorFromKeys();
  const moving = mv.lengthSq() > 0;

  if (moving) {
    const dx = mv.x * MOVE_SPEED * dt;
    const dz = mv.y * MOVE_SPEED * dt;
    player.position.x += dx;
    player.position.z += dz;

    const targetAngle = Math.atan2(-mv.x, -mv.y);
    let delta = targetAngle - player.rotation.y;
    delta = Math.atan2(Math.sin(delta), Math.cos(delta));
    player.rotation.y += delta * Math.min(1, dt * 10);

    walkPhase += dt * 9;
  } else {
    walkPhase *= 0.9;
  }

  // 지형에 맞춰 높이 스냅
  const gh = groundHeightAt(player.position.x, player.position.z);
  player.position.y += (gh - player.position.y) * Math.min(1, dt * 10);

  // 걷기 애니메이션
  const swing = Math.sin(walkPhase) * (moving ? 0.55 : 0);
  armL.rotation.x = swing;
  armR.rotation.x = -swing;
  legL.rotation.x = -swing;
  legR.rotation.x = swing;
  bodyPivot.position.y = 1.0 + Math.abs(Math.sin(walkPhase)) * (moving ? 0.06 : 0);

  // --- 카메라 (3인칭 추격 카메라) ---
  const rotatedOffset = camOffsetBase.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
  const desiredCamPos = player.position.clone().add(rotatedOffset);
  camPos.lerp(desiredCamPos, 1 - Math.pow(0.001, dt));
  camera.position.copy(camPos);
  camera.lookAt(player.position.clone().add(camLookOffset));

  // --- 포탈 인터랙션 ---
  let nearest = null;
  let nearestDist = Infinity;
  for (const p of portals) {
    const d = p.position.distanceTo(player.position);
    if (d < nearestDist) { nearestDist = d; nearest = p; }

    const isNear = d < PORTAL_RADIUS;
    const targetActive = isNear ? 1 : 0;
    p.userData.active += (targetActive - p.userData.active) * Math.min(1, dt * 6);

    const a = p.userData.active;
    p.userData.ring.material.emissiveIntensity = p.userData.baseEmissive + a * 1.4;
    p.userData.ring.rotation.z += dt * (0.3 + a * 1.2);
    p.userData.light.intensity = p.userData.baseLightIntensity + a * 2.2;

    const spriteScale = 1 + a * 0.28;
    p.userData.sprite.scale.set(
      p.userData.baseSpriteScale.x * spriteScale,
      p.userData.baseSpriteScale.y * spriteScale,
      1
    );
    p.userData.sprite.position.y = 5.2 + Math.sin(performance.now() * 0.002 + p.position.x) * 0.15 + a * 0.3;
  }

  if (nearest && nearestDist < PORTAL_RADIUS) {
    portalHintNameEl.textContent = nearest.userData.name;
    portalHintEl.classList.add("show");
  } else {
    portalHintEl.classList.remove("show");
  }

  renderer.render(scene, camera);
}

/* =========================================================
   로딩 화면 종료
========================================================= */
const loadingEl = document.getElementById("loading");
requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    loadingEl.classList.add("hide");
    setTimeout(() => loadingEl.remove(), 700);
  });
});

animate();
</script>
