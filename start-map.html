<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>카피바라 환경동아리 메타버스 · 시작맵</title>
<style>
  :root{
    --ink:#203e36;
    --muted:#65796d;
    --green:#24654b;
    --cream:#faf9ef;
    --gold:#e8bf63;
    --gold-deep:#d9942b;
    --sage:#dbe7ce;
  }

  *{ box-sizing:border-box; }

  html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#dce9cf;
    color:var(--ink);
    font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    user-select:none;
  }

  #app{
    position:fixed;
    inset:0;
  }

  canvas{
    display:block;
    outline:none;
  }

  /* ---------- loading screen ---------- */
  #loading{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    background:radial-gradient(120% 90% at 50% -10%, #eef2df 0%, #dbe7ce 55%, #cbd9b8 100%);
    transition:opacity .6s ease;
  }
  #loading.hide{ opacity:0; pointer-events:none; }
  .loading-badge{
    width:58px; height:58px; border-radius:50%;
    border:4px solid #ffffffa0; border-top-color:var(--green);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-text{ font-size:18px; font-weight:700; color:var(--ink); }
  .loading-sub{ font-size:13px; color:var(--muted); }

  /* ---------- HUD ---------- */
  .hud{ position:fixed; z-index:20; pointer-events:none; }
  .card{
    background:#faf9eff2;
    border:1px solid #ffffff99;
    box-shadow:0 6px 25px #28492b1f;
    border-radius:18px;
    pointer-events:auto;
  }

  #title-card{ top:20px; left:20px; max-width:300px; padding:16px 20px; }
  #title-card .eyebrow{ font-size:10px; letter-spacing:3px; font-weight:800; color:#63816e; }
  #title-card h1{ font-size:20px; margin:5px 0 3px; letter-spacing:-.5px; color:var(--ink); }
  #title-card p{ margin:0; font-size:12.5px; line-height:1.6; color:var(--muted); }

  #controls-card{ bottom:20px; left:20px; padding:13px 18px; display:flex; align-items:center; gap:10px; }
  #controls-card .keys{ font-size:12px; color:var(--ink); }
  kbd{
    background:white; border:1px solid #c5d1bf; border-bottom:3px solid #c5d1bf;
    border-radius:5px; padding:2px 5px; margin:0 2px; font-size:11px;
  }
  #resetView{
    border:1px solid #cfd9c4; border-radius:12px; background:var(--cream); color:var(--ink);
    padding:8px 12px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  #resetView:hover{ background:#eef3e2; }

  #portal-hint{
    top:20px; right:20px; text-align:right; padding:14px 20px;
    opacity:0; transform:translateY(-6px);
    transition:opacity .35s ease, transform .35s ease;
  }
  #portal-hint.show{ opacity:1; transform:translateY(0); }
  #portal-hint h2{ margin:0 0 2px; font-size:16px; font-weight:800; color:var(--green); }
  #portal-hint p{ margin:0; font-size:11.5px; color:var(--muted); }
</style>
</head>
<body>

  <div id="app"></div>

  <div id="loading">
    <div class="loading-badge"></div>
    <div class="loading-text">불러오는 중...</div>
    <div class="loading-sub">카피바라 환경동아리 메타버스 시작맵을 준비하고 있어요</div>
  </div>

  <div class="hud card" id="title-card">
    <div class="eyebrow">CAPYBARA · 환경동아리</div>
    <h1>시작맵</h1>
    <p>카피바라 마스코트를 움직여 네 곳의 포탈을 찾아보세요.<br/>포탈 가까이 가면 안내판이 밝아집니다.</p>
  </div>

  <div class="hud card" id="controls-card">
    <div class="keys">
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>방향키</kbd> 이동
      <kbd>좌클릭 드래그</kbd> 시점
    </div>
    <button id="resetView" type="button">시점 초기화</button>
  </div>

  <div class="hud card" id="portal-hint">
    <h2 id="portal-hint-name">포탈</h2>
    <p>가까이 다가왔습니다</p>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

/* =========================================================
   기본 세팅 (색·조명·카메라는 참고 파일 값을 기준으로 맞춤)
========================================================= */
const app = document.getElementById("app");

const scene = new THREE.Scene();
scene.background = new THREE.Color("#dbe7ce");
scene.fog = new THREE.Fog("#dbe7ce", 46, 150);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 500);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);
renderer.domElement.style.touchAction = "none";
renderer.domElement.style.cursor = "grab";

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

scene.add(new THREE.HemisphereLight(0xfffbe5, 0x91a582, 2.4));
const sun = new THREE.DirectionalLight(0xffedcc, 2.6);
sun.position.set(-35, 55, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -55, right: 55, top: 55, bottom: -55 });
sun.shadow.bias = -0.001;
scene.add(sun);

/* =========================================================
   저폴리 프리미티브 헬퍼 (참고 파일과 같은 방식: 박스/구 조합)
========================================================= */
function mat(c, extra) {
  return new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 1 }, extra));
}
const unitSphere = new THREE.SphereGeometry(1, 14, 10);
function boxMesh(w, h, d, c, x, y, z, parent = scene, extra) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c, extra));
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
function ballMesh(w, h, d, c, x, y, z, parent = scene, extra) {
  const m = new THREE.Mesh(unitSphere, mat(c, extra));
  m.scale.set(w, h, d);
  m.position.set(x, y, z);
  m.castShadow = true;
  parent.add(m);
  return m;
}
function cylMesh(rt, rb, h, c, x, y, z, parent = scene, extra) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 12), mat(c, extra));
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

// 참고 파일과 같은 방식의 카드형 라벨 (크림 배경 + 진한 초록 글씨)
function label(text, x, y, z, size = 6) {
  const c = document.createElement("canvas");
  c.width = 512; c.height = 88;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#faf9ef";
  ctx.beginPath();
  ctx.roundRect(0, 0, 512, 88, 22);
  ctx.fill();
  ctx.fillStyle = "#305747";
  ctx.font = "bold 34px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, 256, 46);
  const tex = new THREE.CanvasTexture(c);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, toneMapped: false, fog: false }));
  sprite.position.set(x, y, z);
  sprite.scale.set(size, size * (88 / 512), 1);
  sprite.renderOrder = 10;
  scene.add(sprite);
  return sprite;
}

/* =========================================================
   유틸: 시드 랜덤 (씬을 매번 동일하게 배치)
========================================================= */
function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20240521);

/* =========================================================
   바닥 (낮은 언덕 + 오솔길, 버텍스 컬러) - 참고 파일의 크림/세이지 톤
========================================================= */
const GROUND_SIZE = 100;
const GROUND_SEG = 70;
const PATH_HALF_WIDTH = 3.0;
const PLAZA_RADIUS = 8;

const groundGeo = new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE, GROUND_SEG, GROUND_SEG);
groundGeo.rotateX(-Math.PI / 2);

const grassA = new THREE.Color(0xB7C98F);
const grassB = new THREE.Color(0xCDDCB6);
const grassDark = new THREE.Color(0x9FB37A);
const pathColor = new THREE.Color(0xE7DDB8);
const pathEdge = new THREE.Color(0xD8CBA0);

// 포탈 위치 (동서남북 십자 배치) - 중앙-포탈 사이는 짧게
const PORTAL_DIST = 22;
const PORTALS_DEF = [
  { name: "이론관", position: new THREE.Vector3(0, 0, -PORTAL_DIST) },
  { name: "대전지도관", position: new THREE.Vector3(PORTAL_DIST, 0, 0) },
  { name: "실험실관", position: new THREE.Vector3(0, 0, PORTAL_DIST) },
  { name: "캠페인관", position: new THREE.Vector3(-PORTAL_DIST, 0, 0) },
];

function distToPathAxes(x, z) {
  const dAxisX = Math.abs(z);
  const dAxisZ = Math.abs(x);
  return Math.min(dAxisX, dAxisZ);
}

const posAttr = groundGeo.attributes.position;
const colors = new Float32Array(posAttr.count * 3);
const tmpColor = new THREE.Color();

function terrainHeight(x, z) {
  return Math.sin(x * 0.09 + 1.3) * Math.cos(z * 0.11) * 0.85 + Math.sin(x * 0.17 - z * 0.06) * 0.4;
}

for (let i = 0; i < posAttr.count; i++) {
  const x = posAttr.getX(i);
  const z = posAttr.getZ(i);

  let h = terrainHeight(x, z);
  const pathDist = distToPathAxes(x, z);
  const onPath = pathDist < PATH_HALF_WIDTH;
  const nearCenter = Math.hypot(x, z) < PLAZA_RADIUS + 0.4;

  if (onPath || nearCenter) h *= 0.1;
  posAttr.setY(i, h);

  if (onPath || nearCenter) {
    const edgeMix = Math.min(1, Math.max(0, (pathDist - (PATH_HALF_WIDTH - 0.6)) / 0.8));
    tmpColor.copy(pathColor).lerp(pathEdge, edgeMix);
  } else {
    const n = (Math.sin(x * 0.31) * Math.cos(z * 0.27) + 1) / 2;
    tmpColor.copy(grassA).lerp(grassB, n);
    if (rand() < 0.05) tmpColor.lerp(grassDark, 0.5);
  }
  colors[i * 3] = tmpColor.r;
  colors[i * 3 + 1] = tmpColor.g;
  colors[i * 3 + 2] = tmpColor.b;
}
groundGeo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
groundGeo.computeVertexNormals();

const groundMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.receiveShadow = true;
scene.add(ground);

function groundHeightAt(x, z) {
  let h = terrainHeight(x, z);
  const pathDist = distToPathAxes(x, z);
  const nearCenter = Math.hypot(x, z) < PLAZA_RADIUS + 0.4;
  if (pathDist < PATH_HALF_WIDTH || nearCenter) h *= 0.1;
  return h;
}

/* =========================================================
   낮은 폴리곤 나무 / 수풀 / 바위 (참고 파일 팔레트)
========================================================= */
const propGroup = new THREE.Group();
scene.add(propGroup);

function makeTree(size, hueIdx) {
  const g = new THREE.Group();
  boxMesh(0.65 * size, 2.6 * size, 0.65 * size, "#998163", 0, 1.3 * size, 0, g);
  const canopyColors = ["#86a56a", "#91b078", "#a7bd80"];
  ballMesh(2.2 * size, 3 * size, 2.2 * size, canopyColors[hueIdx % canopyColors.length], 0, 4 * size, 0, g);
  return g;
}
function makeBush(size) {
  return ballMesh(1.1 * size, 0.9 * size, 1.1 * size, "#93b276", 0, 0.6 * size, 0, propGroup);
}
function makeRock(size) {
  const m = new THREE.Mesh(new THREE.DodecahedronGeometry(0.4 * size, 0), mat("#b9b79f"));
  m.position.y = 0.2 * size;
  m.rotation.set(rand() * Math.PI, rand() * Math.PI, rand() * Math.PI);
  m.castShadow = true;
  return m;
}

function isBlocked(x, z, clearance) {
  if (distToPathAxes(x, z) < clearance) return true;
  if (Math.hypot(x, z) < 9.5) return true; // 중앙 광장 + 가디언 나무
  for (const p of PORTALS_DEF) {
    if (p.position.distanceTo(new THREE.Vector3(x, 0, z)) < 7.5) return true;
  }
  return Math.hypot(x, z) > GROUND_SIZE / 2 - 5;
}

for (let i = 0; i < 170; i++) {
  const x = (rand() - 0.5) * GROUND_SIZE * 0.92;
  const z = (rand() - 0.5) * GROUND_SIZE * 0.92;
  if (isBlocked(x, z, 3.6)) continue;

  const roll = rand();
  let obj;
  if (roll < 0.62) obj = makeTree(0.75 + rand() * 0.8, Math.floor(rand() * 3));
  else if (roll < 0.85) obj = makeBush(0.7 + rand() * 0.7);
  else obj = makeRock(0.7 + rand() * 1.0);

  obj.position.set(x, groundHeightAt(x, z), z);
  obj.rotation.y = rand() * Math.PI * 2;
  propGroup.add(obj);
}

/* =========================================================
   캐릭터 (귀여운 카피바라 - 참고 파일과 동일한 디자인/색/크기)
========================================================= */
const player = new THREE.Group();

ballMesh(2, 1.45, 3, "#b99165", 0, 2.1, 0, player); // 몸통
ballMesh(1.65, 1.4, 1.9, "#c3a071", 0, 2.8, 2.45, player); // 머리
boxMesh(2.8, 1.55, 1.65, "#c3a071", 0, 2.5, 3.35, player); // 주둥이
ballMesh(0.45, 0.55, 0.3, "#9b744e", -1.15, 4, 2.1, player); // 왼쪽 귀
ballMesh(0.45, 0.55, 0.3, "#9b744e", 1.15, 4, 2.1, player); // 오른쪽 귀
ballMesh(0.16, 0.18, 0.14, "#302c20", -1.5, 3.1, 3.05, player); // 왼쪽 눈
ballMesh(0.16, 0.18, 0.14, "#302c20", 1.5, 3.1, 3.05, player); // 오른쪽 눈
ballMesh(0.5, 0.2, 0.15, "#72563c", 0, 2.8, 4.18, player); // 코
ballMesh(0.7, 0.65, 0.7, "#e9a143", 0, 4.35, 2.1, player); // 꽃 장식
ballMesh(0.35, 0.09, 0.17, "#658b46", 0.2, 5, 2.1, player); // 꽃 잎

const legs = [];
for (const x of [-1.2, 1.2]) for (const z of [-1.7, 1.5]) legs.push(boxMesh(0.85, 1.3, 0.9, "#9e794f", x, 0.7, z, player));

const SPAWN_Z = PORTAL_DIST * 0.42;
player.position.set(0, 0, SPAWN_Z);
scene.add(player);

/* =========================================================
   포탈 (은은하게 빛나는 링 + 좌대 + 라벨)
========================================================= */
function createPortal(def) {
  const group = new THREE.Group();

  cylMesh(2.0, 2.3, 0.5, "#cabb92", 0, 0.25, 0, group);
  cylMesh(1.5, 1.7, 0.4, "#d9cba0", 0, 0.7, 0, group);

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(1.75, 0.22, 10, 28),
    mat("#e8bf63", { emissive: "#d9942b", emissiveIntensity: 0.35, roughness: 0.5 })
  );
  ring.position.y = 2.3;
  ring.castShadow = true;
  group.add(ring);

  const groundRing = new THREE.Mesh(
    new THREE.RingGeometry(2.6, 3.05, 40),
    new THREE.MeshBasicMaterial({ color: "#e8bf63", side: THREE.DoubleSide })
  );
  groundRing.rotation.x = -Math.PI / 2;
  groundRing.position.y = 0.03;
  group.add(groundRing);

  const light = new THREE.PointLight("#f3d78a", 0.8, 11, 2);
  light.position.set(0, 2.3, 0);
  group.add(light);

  const sprite = label(def.name, 0, 4.3, 0, 6.2);
  group.add(sprite);

  group.position.copy(def.position);
  group.position.y = groundHeightAt(def.position.x, def.position.z);

  group.userData = {
    name: def.name,
    ring, groundRing, light, sprite,
    baseSpriteScale: sprite.scale.clone(),
    active: 0,
  };
  return group;
}

const portals = PORTALS_DEF.map(createPortal);
portals.forEach((p) => scene.add(p));

/* =========================================================
   중앙 광장 - 가디언 나무 + 나무에 걸린 방명록
========================================================= */
const guardianTree = new THREE.Group();
boxMesh(1.1, 5.0, 1.1, "#8a6f4c", 0, 2.5, 0, guardianTree);
ballMesh(4.6, 4.0, 4.6, "#91b078", 0, 6.4, 0, guardianTree);
ballMesh(3.4, 3.0, 3.4, "#a7bd80", 0, 8.6, 0, guardianTree);
ballMesh(2.1, 2.0, 2.1, "#86a56a", 0, 10.6, 0, guardianTree);
for (let i = 0; i < 10; i++) {
  const ang = rand() * Math.PI * 2;
  const r = 1.6 + rand() * 2.6;
  const y = 5.4 + rand() * 5.4;
  ballMesh(0.14, 0.14, 0.14, "#e9a143", Math.cos(ang) * r, y, Math.sin(ang) * r, guardianTree, { emissive: "#d9942b", emissiveIntensity: 0.4 });
}

// 나무에 걸린 방명록 판
const guestbook = new THREE.Group();
boxMesh(1.9, 1.3, 0.1, "#3d775b", 0, 2.65, 0.72, guestbook);
boxMesh(1.65, 1.05, 0.12, "#f9f0cc", 0, 2.65, 0.78, guestbook);
guardianTree.add(guestbook);
const guestbookLabel = label("🌿 카피바라 방명록", 0, 3.7, 0.8, 5.4);
guardianTree.add(guestbookLabel);

guardianTree.position.set(0, groundHeightAt(0, 0), 0);
scene.add(guardianTree);

const plaza = new THREE.Mesh(
  new THREE.CylinderGeometry(PLAZA_RADIUS, PLAZA_RADIUS + 0.4, 0.3, 24),
  mat("#e1dcc4")
);
plaza.position.y = groundHeightAt(0, 0) + 0.14;
plaza.receiveShadow = true;
scene.add(plaza);

/* =========================================================
   입력 처리
========================================================= */
const keys = new Set();
window.addEventListener("keydown", (e) => keys.add(e.code));
window.addEventListener("keyup", (e) => keys.delete(e.code));

/* =========================================================
   카메라 - 좌클릭 드래그로만 회전하는 궤도 카메라
   (참고 파일과 동일한 방식: yaw/pitch를 드래그로 조절, WASD는 그 시점 기준)
========================================================= */
const cameraOrbit = { yaw: 0, pitch: 0.72, distance: 46 };
const DEFAULT_ORBIT = { yaw: 0, pitch: 0.72 };
let cameraDrag = null;

renderer.domElement.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  cameraDrag = { id: e.pointerId, x: e.clientX, y: e.clientY };
  renderer.domElement.setPointerCapture(e.pointerId);
  renderer.domElement.style.cursor = "grabbing";
});
renderer.domElement.addEventListener("pointermove", (e) => {
  if (!cameraDrag || cameraDrag.id !== e.pointerId) return;
  cameraOrbit.yaw -= (e.clientX - cameraDrag.x) * 0.006;
  cameraOrbit.pitch = THREE.MathUtils.clamp(cameraOrbit.pitch + (e.clientY - cameraDrag.y) * 0.004, 0.32, 1.2);
  cameraDrag.x = e.clientX;
  cameraDrag.y = e.clientY;
});
function endCameraDrag() {
  cameraDrag = null;
  renderer.domElement.style.cursor = "grab";
}
renderer.domElement.addEventListener("pointerup", endCameraDrag);
renderer.domElement.addEventListener("pointercancel", endCameraDrag);
renderer.domElement.addEventListener("lostpointercapture", endCameraDrag);
window.addEventListener("blur", endCameraDrag);

document.getElementById("resetView").addEventListener("click", () => {
  cameraOrbit.yaw = DEFAULT_ORBIT.yaw;
  cameraOrbit.pitch = DEFAULT_ORBIT.pitch;
});

/* =========================================================
   메인 루프
========================================================= */
const MOVE_SPEED = 19;
const PORTAL_RADIUS = 6;
const portalHintEl = document.getElementById("portal-hint");
const portalHintNameEl = document.getElementById("portal-hint-name");

const clock = new THREE.Clock();
const followPos = player.position.clone();
let t = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;

  // --- 이동: 항상 "현재 카메라가 보고 있는 방향" 기준 (참고 파일과 동일한 방식) ---
  let dx = 0, dz = 0;
  if (keys.has("KeyD") || keys.has("ArrowRight")) dx += 1;
  if (keys.has("KeyA") || keys.has("ArrowLeft")) dx -= 1;
  if (keys.has("KeyS") || keys.has("ArrowDown")) dz += 1;
  if (keys.has("KeyW") || keys.has("ArrowUp")) dz -= 1;
  const localX = dx, localZ = dz;
  dx = localX * Math.cos(cameraOrbit.yaw) + localZ * Math.sin(cameraOrbit.yaw);
  dz = -localX * Math.sin(cameraOrbit.yaw) + localZ * Math.cos(cameraOrbit.yaw);
  const moving = Math.hypot(dx, dz) > 0;

  if (moving) {
    const len = Math.hypot(dx, dz);
    const half = GROUND_SIZE / 2 - 3;
    player.position.x = THREE.MathUtils.clamp(player.position.x + (dx / len) * MOVE_SPEED * dt, -half, half);
    player.position.z = THREE.MathUtils.clamp(player.position.z + (dz / len) * MOVE_SPEED * dt, -half, half);

    const want = Math.atan2(dx, dz);
    const diff = Math.atan2(Math.sin(want - player.rotation.y), Math.cos(want - player.rotation.y));
    player.rotation.y += diff * Math.min(1, dt * 12);
  }

  const gh = groundHeightAt(player.position.x, player.position.z);
  player.position.y = gh + (moving ? Math.abs(Math.sin(t * 10)) * 0.18 : 0);

  legs.forEach((l, i) => {
    l.rotation.x = moving ? Math.sin(t * 12 + (i === 0 || i === 3 ? 0 : Math.PI)) * 0.5 : 0;
  });

  // --- 카메라: 드래그로만 회전, 캐릭터를 부드럽게 따라감 ---
  followPos.lerp(player.position, Math.min(1, dt * 4));
  const horizontal = cameraOrbit.distance * Math.cos(cameraOrbit.pitch);
  camera.position.set(
    followPos.x + Math.sin(cameraOrbit.yaw) * horizontal,
    followPos.y + Math.sin(cameraOrbit.pitch) * cameraOrbit.distance + 1.4,
    followPos.z + Math.cos(cameraOrbit.yaw) * horizontal
  );
  camera.lookAt(followPos.x, followPos.y + 2.6, followPos.z);

  // --- 포탈 인터랙션 ---
  let nearest = null;
  let nearestDist = Infinity;
  for (const p of portals) {
    const d = p.position.distanceTo(player.position);
    if (d < nearestDist) { nearestDist = d; nearest = p; }

    const isNear = d < PORTAL_RADIUS;
    p.userData.active += ((isNear ? 1 : 0) - p.userData.active) * Math.min(1, dt * 6);
    const a = p.userData.active;
    const u = p.userData;

    u.ring.rotation.y += dt * (0.2 + a * 0.6);
    u.ring.material.emissiveIntensity = 0.35 + a * 0.6;
    u.light.intensity = 0.8 + a * 1.6;
    u.groundRing.material.color.set(a > 0.5 ? "#a6cc85" : "#e8bf63");

    const s = 1 + a * 0.22;
    u.sprite.scale.set(u.baseSpriteScale.x * s, u.baseSpriteScale.y * s, 1);
  }

  if (nearest && nearestDist < PORTAL_RADIUS) {
    portalHintNameEl.textContent = nearest.userData.name;
    portalHintEl.classList.add("show");
  } else {
    portalHintEl.classList.remove("show");
  }

  renderer.render(scene, camera);
}

/* =========================================================
   로딩 화면 종료
========================================================= */
const loadingEl = document.getElementById("loading");
requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    loadingEl.classList.add("hide");
    setTimeout(() => loadingEl.remove(), 700);
  });
});

animate();
</script>
